<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earnova - Create Account</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#18202f;
}
.header{
  background:linear-gradient(135deg,#6c4cff,#8b5cf6);
  color:white;
  padding:28px 18px;
  text-align:center;
}
.logo{font-size:30px;font-weight:800}
.header p{margin-top:6px;opacity:.95}

.signup{
  min-height:calc(100vh - 150px);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 18px;
}
.box{
  width:100%;
  max-width:430px;
  background:white;
  padding:28px 22px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}
h2{text-align:center;margin-bottom:8px}
.sub{
  text-align:center;
  color:#667085;
  font-size:14px;
  margin-bottom:24px;
}
label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}
.group{margin-bottom:16px}
input{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  font-size:15px;
  outline:none;
}
input:focus{border-color:#6c4cff}

.otp{
  display:flex;
  gap:8px;
}
.otp input{flex:1}
.otp button{
  border:0;
  border-radius:9px;
  padding:0 12px;
  background:#6c4cff;
  color:white;
  font-weight:bold;
}
.mainbtn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#6c4cff;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
}
.note{
  margin-top:15px;
  text-align:center;
  font-size:12px;
  color:#667085;
  line-height:1.5;
}
.footer{
  text-align:center;
  padding:20px;
  background:#202432;
  color:white;
  font-size:13px;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">💰 Earnova</div>
  <p>Complete tasks • Earn rewards</p>
</header>

<section class="signup">
  <div class="box">

    <h2>Create Account</h2>
    <p class="sub">Join Earnova and explore available tasks</p>

    <div class="group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name">
    </div>

    <div class="group">
      <label>Username</label>
      <input type="text" placeholder="Choose a username">
    </div>

    <div class="group">
      <label>Mobile Number</label>
      <div class="otp">
        <input
          type="tel"
          maxlength="10"
          inputmode="numeric"
          placeholder="10-digit mobile number">
        <button type="button">Send OTP</button>
      </div>
    </div>

    <div class="group">
      <label>OTP</label>
      <input
        type="text"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter OTP">
    </div>

    <div class="group">
      <label>Password</label>
      <input
        type="password"
        placeholder="Create a password">
    </div>

<button class="mainbtn" type="button" onclick="window.location.href='Dashboard.html'">
  Create Account
</button>

    <p class="note">
      Your mobile number is used for account verification.
      Real SMS OTP verification will be connected through a secure backend.
    </p>

  </div>
</section>

<footer class="footer">
  © 2026 Earnova. All rights reserved.
</footer>

</body>
</html>
